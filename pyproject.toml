[project]
name = "unfold"
version = "0.1.0"
description = "Turn learning material into explainer videos: scripts, visual plans, manim scenes, and voice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "lxml>=6.1.3",
    "manim>=0.21.0,<0.22",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pypdfium2>=5.14",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "trafilatura>=2.3",
]

[project.scripts]
unfold = "unfold.cli:main"

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
# E and W: style errors. F: likely mistakes. I: import order. UP: newer syntax.
# B: common bugs. SIM: simpler code. RUF: Ruff's own rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88 characters. Strings and comments it cannot wrap
# may run to 100.
max-line-length = 100

[tool.ruff.lint.per-file-ignores]
# Word lists read better as one string split on spaces than as long list literals.
"src/unfold/lint/words.py" = ["SIM905"]

[tool.pyright]
include = ["src", "tests", "examples", ".claude/hooks"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest]
testpaths = ["tests"]
# pytest skips folders named build by default, which would hide tests/build.
norecursedirs = [".*", "*.egg", "__pycache__", "dist", "node_modules", "venv"]
# macOS can mark .venv files as hidden, and Python then skips the .pth file
# that makes the package importable. This path keeps the tests working anyway.
pythonpath = ["src"]
addopts = ["-ra"]
strict = true
markers = ["slow: renders a video, so it takes seconds. Skip with -m 'not slow'."]
# pydub, a manim dependency, imports a module that Python 3.13 removes.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
